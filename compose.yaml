# poring-lab -- see README.md for the topology, ports and quickstart.
#
# Profiles:  core    db + rathena (the game server)
#            remote  desktop (Xvfb + the ONE RDP session) + backend + frontend
#            vision  GPU agent (needs remote running to do anything useful)
#            sniffer packet ground truth (ADR-0007): shares rathena's network namespace, writes
#                    the `captures` volume, feeds the backend's console timeline. OFFLINE only.
#
# Host protection (this host also runs 24/7 capture services): every lab container has a hard
# memory cap with NO swap (memswap_limit == mem_limit) and oom_score_adj 500, so under memory
# pressure the kernel kills a lab container before anything else. CPU: the heavy lab services
# (desktop, backend) carry a low cpu_shares weight so the quant stack wins CPU contention, and
# desktop also a hard `cpus` ceiling.

name: poring-lab

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-lab: &lab
  restart: unless-stopped
  init: true
  oom_score_adj: 500
  logging: *logging

services:
  db:
    <<: *lab
    profiles: [core, sniffer]
    image: mariadb:11.8.9
    environment:
      MARIADB_DATABASE: ${DB_NAME:-ragnarok}
      MARIADB_USER: ${DB_USER:-ragnarok}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (scripts/init_env.sh)}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env (scripts/init_env.sh)}
    # Thai end to end: the server default charset decides the charset of the `ragnarok` database the
    # image creates, and of every table rathena imports into it (entrypoint.sh refuses anything but
    # tis620). Only applies when the volume is first initialised.
    command: ["--character-set-server=tis620", "--collation-server=tis620_bin"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    memswap_limit: 512m
    # No ports: only rathena talks to the database, over the compose network.

  rathena:
    <<: *lab
    profiles: [core, sniffer]
    build:
      context: services/rathena
      args:
        RATHENA_REF: ${RATHENA_REF:-e985006171d2eb320ee512a653f4c83aea3d81b6}
        PACKETVER: ${PACKETVER:-20211103}
        PRERE: ${RATHENA_PRERE:-no}
        VIP: ${RATHENA_VIP:-no}
        MAKE_JOBS: ${RATHENA_MAKE_JOBS:-4}
    image: poring-lab/rathena:pv${PACKETVER:-20211103}-prere-${RATHENA_PRERE:-no}
    depends_on:
      db:
        condition: service_healthy
    environment:
      # char_ip / map_ip ADVERTISED to game clients. Must be this host's LAN IP -- the container IP
      # makes every LAN client fail right after login.
      HOST_LAN_IP: ${HOST_LAN_IP:?set HOST_LAN_IP in .env}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-ragnarok}
      DB_USER: ${DB_USER:-ragnarok}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      RATHENA_SERVER_USER: ${RATHENA_SERVER_USER:?set RATHENA_SERVER_USER in .env}
      RATHENA_SERVER_PASSWORD: ${RATHENA_SERVER_PASSWORD:?set RATHENA_SERVER_PASSWORD in .env}
      RATHENA_SERVER_NAME: ${RATHENA_SERVER_NAME:-PoringLab}
      RATHENA_NEW_ACCOUNT: ${RATHENA_NEW_ACCOUNT:-yes}
      RATHENA_PINCODE: ${RATHENA_PINCODE:-no}
      RATHENA_WEB_SERVER: ${RATHENA_WEB_SERVER:-false}
      # Optional test player account, upserted at every start (credentials only in .env).
      RATHENA_TEST_USER: ${RATHENA_TEST_USER:-}
      RATHENA_TEST_PASSWORD: ${RATHENA_TEST_PASSWORD:-}
      # The agent's accounts (upserted at every start): a player (group 0) and a validation GM
      # (group 20, conf/import/groups.yml). Credentials only in .env, never printed or logged.
      RATHENA_AGENT_USER: ${RATHENA_AGENT_USER:-}
      RATHENA_AGENT_PASSWORD: ${RATHENA_AGENT_PASSWORD:-}
      RATHENA_GM_USER: ${RATHENA_GM_USER:-}
      RATHENA_GM_PASSWORD: ${RATHENA_GM_PASSWORD:-}
    # The runtime tree (binaries, conf, db, npc, sql-files) is extracted here from ONE tar in the
    # image at every start: ~1600 files never touch the shared host disk. tmpfs pages count against
    # mem_limit (the tree is ~70 MiB; exec: the servers run from it).
    tmpfs:
      - /opt/rathena:rw,exec,nosuid,nodev,size=192m,uid=1000,gid=1000,mode=0755
    networks:
      default:
        # PINNED (ADR-0007): the sniffer shares this namespace, and the backend accepts
        # /ingest/packets ONLY from this address (INGEST_PEER).
        ipv4_address: 10.210.96.6
    ports:
      - "${HOST_LAN_IP:?}:6900:6900" # login
      - "${HOST_LAN_IP:?}:6121:6121" # char
      - "${HOST_LAN_IP:?}:5121:5121" # map
    mem_limit: 1536m
    memswap_limit: 1536m

  desktop:
    <<: *lab
    profiles: [remote]
    build: services/desktop
    image: poring-lab/desktop:local
    environment:
      DISPLAY: ":99"
      # The canvas is larger than the Windows session: xfreerdp draws the session 1:1 at its top-left
      # (SESSION_SIZE), and Moonlight's console-mode window only opens at native size when the stream
      # is under 80 % of the screen in both directions (ADR-0009 amendment, 2026-10-02).
      XVFB_RESOLUTION: ${XVFB_RESOLUTION:-1920x1200x24}
      SESSION_SIZE: ${SESSION_SIZE:-1440x900}
      # Empty WIN_HOST/RDP_* => no RDP connection is attempted (Xvfb-only mode).
      WIN_HOST: ${WIN_HOST:-}
      RDP_PORT: ${RDP_PORT:-3389}
      RDP_USER: ${RDP_USER:-}
      RDP_PASSWORD: ${RDP_PASSWORD:-}
      RDP_DOMAIN: ${RDP_DOMAIN:-}
      RDP_CERT_SHA256: ${RDP_CERT_SHA256:-}
      RDP_GFX: ${RDP_GFX:-}
      # ADR-0004, human-only tools, by keyword (see rdp-loop.sh). Both default OFF.
      RDP_CLIPBOARD: ${RDP_CLIPBOARD:-off} # off | text-to-remote
      RDP_DRIVES: ${RDP_DRIVES:-} # "" | transfer  (-> \\tsclient\transfer in Windows)
      NOVNC_VIEW_ONLY: ${NOVNC_VIEW_ONLY:-true}
    volumes:
      - x11-unix:/tmp/.X11-unix
      - transfer:/transfer
      # The capture-backend lock (ADR-0009): rdp-loop connects only while it says `rdp`. A
      # DIRECTORY mount (an atomic rename on the host stays visible); written only by
      # scripts/capture_backend.py on the host, read-only everywhere (tests/test_guards.py).
      - ./state:/lab-state:ro
    ports:
      - "${HOST_LAN_IP:?}:6080:6080" # noVNC -- NO AUTHENTICATION, LAN only
    # 1.5 GiB: the 512 MiB transfer tmpfs is charged to whichever container WRITES a file, and
    # Windows -> Linux copies are written by xfreerdp here. With no swap, overflowing the limit
    # would OOM-kill the RDP session (peak without transfers: ~220 MiB).
    mem_limit: 1536m
    memswap_limit: 1536m
    # CPU (2026-09-30, docs/phase0-latency.md "CPU protection"): xfreerdp's software decode takes
    # 7-15 cores during full-scene motion. cpu_shares 64 = cgroup v2 cpu.weight ~12 (runc >= 1.3.2)
    # vs 100 for the quant containers, so they win any contention; cpus 8 is the ceiling that cost
    # no measured fps (6 cores: -35%, 4 cores: -60% and it throttles Xvfb itself).
    cpu_shares: 64
    cpus: 8

  backend:
    <<: *lab
    profiles: [remote]
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    image: poring-lab/backend:local
    depends_on:
      desktop:
        condition: service_healthy
    environment:
      DISPLAY: ":99"
      # The stream and the agent's frames are cropped to the session; input is normalised over it.
      SESSION_SIZE: ${SESSION_SIZE:-1440x900}
      DATA_DIR: /data
      # Browser WebSocket Origin allowlist (comma-separated); unknown origins are refused.
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://${HOST_LAN_IP:?}:3000}
      ASSIST_LEASE_S: ${ASSIST_LEASE_S:-3.0}
      STREAM_FPS: ${STREAM_FPS:-30}
      # Phase 0 (docs/phase0-latency.md): grab on XDamage, capped at STREAM_MAX_FPS; "fixed" = the
      # old STREAM_FPS slot grid. Both switchable at runtime (POST /debug/stream-tuning, loopback).
      STREAM_CAPTURE: ${STREAM_CAPTURE:-damage}
      STREAM_MAX_FPS: ${STREAM_MAX_FPS:-60}
      JPEG_QUALITY: ${JPEG_QUALITY:-80}
      CAPTURE_WITH_CURSOR: ${CAPTURE_WITH_CURSOR:-false}
      # The same ADR-0004 keywords as the desktop: the backend offers exactly what RDP was started
      # with (clipboard paste; the /transfer HTTP routes).
      RDP_CLIPBOARD: ${RDP_CLIPBOARD:-off}
      RDP_DRIVES: ${RDP_DRIVES:-}
      TRANSFER_DIR: /transfer
      # ADR-0007: /ingest/packets accepts only rathena's pinned address (the sniffer's namespace).
      INGEST_PEER: 10.210.96.6
      # Black-screen detector: the RO client area "x,y,w,h" in desktop pixels ("" = whole frame).
      GAME_REGION: ${GAME_REGION:-}
      BLACK_HOLD_S: ${BLACK_HOLD_S:-5}
      # S2 frame bus: the console's JPEG rate while it reads decoded frames (the bot reads them all).
      CONSOLE_FPS: ${CONSOLE_FPS:-15}
      # ADR-0016: the Windows host this lab drives; config/environments.yaml must name the same.
      WIN_HOST: ${WIN_HOST:-}
      # The lab host's own LAN address: the Settings page refuses WRITES from it (host scripts
      # can forge an Origin) and from WIN_HOST (the machine the bot drives) -- 2026-10-06.
      HOST_LAN_IP: ${HOST_LAN_IP:?}
    volumes:
      - x11-unix:/tmp/.X11-unix:ro
      - ./data:/data
      # Offline analysis tools only (read-only); never mounted in vision (tests/test_guards.py).
      - captures:/captures:ro
      # Browser uploads are written here (charged to this container's 1 GiB: peak ~90 MiB + 512).
      - transfer:/transfer
      # The capture-backend lock (ADR-0009), shown in /health and the console status.
      - ./state:/lab-state:ro
      # ADR-0016: the environment allowlist (read-only; backend only -- tests/test_guards.py).
      - ./config:/lab-config:ro
      # The HUMAN-ONLY settings store (2026-10-06): the server allowlist + its audit log, the
      # foreground gate's templates. Read-write in the backend ONLY (never vision, which can
      # write ./data); the one writer is the Settings page's PUT (tests/test_guards.py).
      - ./settings:/lab-settings
      # S2 frame bus (docs/s2-plan.md): decoded console frames, read-only here.
      - framebus:/framebus:ro
      # S2 input socket (ADR-0014): the Injector -- the ONE input writer -- sends the mux's events
      # to the S2 client here. Backend + gamestream only (tests/test_guards.py).
      - s2-input:/s2-input
    ports:
      - "${HOST_LAN_IP:?}:8000:8000" # /health, /ws/stream, /ws/input
    # 8001 (/internal/agent) is deliberately NOT published: compose network only.
    expose: ["8001"]
    # default (LAN publishing, the other services) + agent (vision only; ADR-0005 option c2). Host
    # scripts must index the DEFAULT network's address by name (scripts/backend_addr.py).
    networks: [default, agent]
    mem_limit: 1g
    memswap_limit: 1g
    # ~1 core during full-scene motion (JPEG encode of the stream): a lower weight than the quant
    # containers (cpu.weight ~35 vs 100), no hard ceiling (the console stream needs it).
    cpu_shares: 256

  frontend:
    <<: *lab
    profiles: [remote]
    build: services/frontend
    image: poring-lab/frontend:local
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Read at request time by the server component -- not baked in at build time.
      BACKEND_PUBLIC_URL: http://${HOST_LAN_IP:?}:8000
    ports:
      - "${HOST_LAN_IP:?}:3000:3000"
    mem_limit: 512m
    memswap_limit: 512m

  vision:
    <<: *lab
    profiles: [vision]
    build:
      context: .
      dockerfile: services/vision/Dockerfile
    image: poring-lab/vision:local
    depends_on:
      backend:
        condition: service_healthy
        required: false # lets `--profile vision` validate on its own
    environment:
      SESSION_SIZE: ${SESSION_SIZE:-1440x900} # grab exactly what the backend maps input over
      BACKEND_AGENT_URL: ws://backend:8001/internal/agent
      AGENT_HZ: ${AGENT_HZ:-10}
      # The GPU is shared with Frigate (NVR) and Ollama: hard-cap this process's VRAM.
      VISION_MAX_VRAM_FRACTION: ${VISION_MAX_VRAM_FRACTION:-0.25}
      VISION_DEBUG_BOX: ${VISION_DEBUG_BOX:-false}
      # ADR-0005 CLOSED for S2 (Batt, 2026-10-04): vision reads ONLY the S2 frame bus -- it has no X
      # socket at all -- and acts only through the mux (/internal/agent).
      VISION_FRAME_SOURCE: bus
      # Its network is internal (no internet): never fetch or auto-install at run time.
      YOLO_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./data:/data
      # S2 frame bus: the same decoded frames the console shows (pixels only), read-only.
      - framebus:/framebus:ro
      # ADR-0005's acceptance test (read-only; run with guarded `run:vision`).
      - ./services/vision/acceptance:/opt/acceptance:ro
      # Batt 2026-10-04: training reads the NAS datasets READ-ONLY (the frame cache's tar shards,
      # scripts/build_frame_cache.py). vision ONLY; soft, so a NAS outage errors instead of hanging.
      - datasets-nas:/datasets:ro
    # ADR-0005 option c2: ONLY the internal agent network -- vision reaches the backend's
    # /internal/agent and nothing else (the backend refuses this subnet on its public listener).
    networks: [agent]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: 6g
    memswap_limit: 6g
    # PyTorch DataLoader workers pass batches through /dev/shm (Docker's default 64 MB is too small
    # for 1280-px batches). Counted inside mem_limit.
    shm_size: 1g

  # ADR-0009 console mode: moonlight-qt shows the Sunshine stream of the Windows CONSOLE session in
  # the same Xvfb :99 and takes its input from the X server (the backend mux's XTest). It streams
  # ONLY while the capture-backend lock says `console` and no xfreerdp window is on the display
  # (gamestream-loop.sh); under `rdp` it idles. Handovers: scripts/capture_backend.py.
  gamestream:
    <<: *lab
    profiles: [gamestream]
    build:
      context: services/gamestream
    image: poring-lab/gamestream:local
    # NO depends_on: a guarded `up -d gamestream` must never recreate desktop as a dependency.
    environment:
      DISPLAY: ":99"
      SESSION_SIZE: ${SESSION_SIZE:-1440x900} # the stream's size, moved 1:1 to the session area
      WIN_HOST: ${WIN_HOST:-} # Sunshine runs on the same Windows host as RDP
      # Mesa llvmpipe (Moonlight's GL renderer here) starts one rasterizer thread per vCPU: 64 on
      # this VM. Inside `cpus: 4` they spin on each other and burn the quota (50 % of periods
      # throttled), and NOT ONE frame was presented: the black stream of 2026-10-02.
      LP_NUM_THREADS: "2"
      # Audio stays on the PC (--audio-on-host), yet Sunshine still sends packets. With no ALSA
      # device here, SDL fell back to its `disk` driver, which can't write on this read-only rootfs.
      SDL_AUDIODRIVER: dummy
      # Diagnostics only (empty = off): Moonlight runs under gdb, thread stacks after N s (loop).
      GAMESTREAM_GDB_AFTER_S: ${GAMESTREAM_GDB_AFTER_S:-}
      LAB_STATE_DIR: /lab-state
    # Nothing writes to the image layer (the shared disk): the AppImage unpacks into the /tmp tmpfs,
    # the pairing key lives in the gamestream-state volume. No RDP_* secrets, no transfer volume.
    read_only: true
    volumes:
      - x11-unix:/x11:ro
      - ./state:/lab-state:ro
      - gamestream-state:/home/desk/.config
      # S2 frame bus: the S2 client is its ONLY writer (backend and vision mount it read-only).
      - framebus:/framebus
      # S2 input socket (ADR-0014): the S2 client listens, the backend's Injector sends.
      - s2-input:/s2-input
    tmpfs:
      - /tmp:size=640m,uid=1000,gid=1000,mode=1777,exec
    # Software H.264 decode of one 1440x900@30 stream + SDL/GL (llvmpipe) presentation. Weight like
    # desktop (12 vs the quant containers' 100); 640 MiB tmpfs is charged here (unpacked ~200 MiB).
    # +64 MiB (2026-10-03, consciously): the frame bus tmpfs (8 x 1440x900 BGRA = 42 MB) is charged
    # to its writer.
    cpu_shares: 64
    cpus: 4
    mem_limit: 1600m
    memswap_limit: 1600m
    # V3 (the S2 spike, clean room 2026-10-03) holds the pairing key in its process memory: never a
    # core file (the host pipes cores to apport). The spike is also non-dumpable (PR_SET_DUMPABLE 0).
    ulimits:
      core: 0

  sniffer:
    <<: *lab
    profiles: [sniffer]
    # ADR-0007. The slim image (2026-10-03): Python + pydantic + websockets + poring_packets, built
    # from the repo root like the backend (uv workspace).
    build:
      context: .
      dockerfile: services/sniffer/Dockerfile
    image: poring-lab/sniffer:local
    network_mode: "service:rathena"
    depends_on:
      rathena:
        condition: service_started
    # Root with every capability dropped except NET_RAW (AF_PACKET); it never sends a packet.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      CAPTURE_IFACE: eth0
      CAPTURE_DIR: /captures
      INGEST_URL: ws://backend:8001/ingest/packets
      # Login ids of the validation (GM) accounts: their sessions are tagged, never logged.
      VALIDATION_USERIDS: ${RATHENA_GM_USER:-}
      # WHICH server this sniffer watches (2026-10-05): the interlock requires the attested
      # server to equal the environment id (config/environments.yaml). Required at start.
      SNIFFER_SERVER_ID: lab-rathena
      PYTHONDONTWRITEBYTECODE: "1"
    # pcapng + events (hourly / 256 MB; 7 days or 20 GB). NEVER ./data: RO login packets carry
    # credentials (the sniffer zeroes the password bytes, and captures still stay out of git).
    volumes:
      - captures:/captures
    mem_limit: 256m
    memswap_limit: 256m

  # --- The Thai-data experiment (Batt, 2026-10-05): a SEPARATE rAthena, "rathena-th" -------------
  # Same image, SHA and pre-renewal mode as `rathena`; its own database (db-th) and a map cache made
  # from the Thai client's GRF by rAthena's own mapcache tool (scripts/gen_mapcache_th.py,
  # data/mapcache-th/, never committed). The current rathena, its db and its map cache are untouched.
  # ONE AT A TIME with rathena, by construction: the same pinned IP (10.210.96.6, the backend's
  # only ingest peer) and the same LAN ports, so Docker refuses to start one while the other runs.
  # Switch with guarded steps (rm:sniffer,rathena then start:rathena-th,sniffer-th, and back).
  # Batt, 2026-10-05: NOT adopted (the Thai data adds nothing for vision); kept as a stopped option
  # (db-th stopped with `scripts/dev.sh --profile th stop db-th`; its volume is kept).
  # TH variables use ':-' (never ':?'): compose interpolates every service before it filters
  # profiles, so a required TH variable would break every compose command until .env has it.
  db-th:
    <<: *lab
    profiles: [th]
    image: mariadb:11.8.9
    pull_policy: never
    environment:
      MARIADB_DATABASE: ${DB_TH_NAME:-ragnarok}
      MARIADB_USER: ${DB_TH_USER:-ragnarok}
      MARIADB_PASSWORD: ${DB_TH_PASSWORD:-}
      MARIADB_ROOT_PASSWORD: ${DB_TH_ROOT_PASSWORD:-}
    command: ["--character-set-server=tis620", "--collation-server=tis620_bin"]
    networks:
      default:
        # PINNED high (2026-10-05): the default network has no ip_range, so a container created
        # while rathena is down got the lowest free address -- rathena's 10.210.96.6 -- and
        # rathena-th then failed with "Address already in use".
        ipv4_address: 10.210.96.250
    volumes:
      - db-th-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    memswap_limit: 512m

  rathena-th:
    <<: *lab
    profiles: [th]
    image: poring-lab/rathena:pv${PACKETVER:-20211103}-prere-${RATHENA_PRERE:-no}
    pull_policy: never
    depends_on:
      db-th:
        condition: service_healthy
    environment:
      HOST_LAN_IP: ${HOST_LAN_IP:-}
      DB_HOST: db-th
      DB_PORT: "3306"
      DB_NAME: ${DB_TH_NAME:-ragnarok}
      DB_USER: ${DB_TH_USER:-ragnarok}
      DB_PASSWORD: ${DB_TH_PASSWORD:-}
      RATHENA_SERVER_USER: ${RATHENA_TH_SERVER_USER:-}
      RATHENA_SERVER_PASSWORD: ${RATHENA_TH_SERVER_PASSWORD:-}
      RATHENA_SERVER_NAME: ${RATHENA_TH_SERVER_NAME:-PoringLab-TH}
      RATHENA_NEW_ACCOUNT: ${RATHENA_NEW_ACCOUNT:-yes}
      RATHENA_PINCODE: ${RATHENA_PINCODE:-no}
      RATHENA_WEB_SERVER: ${RATHENA_WEB_SERVER:-false}
      RATHENA_TEST_USER: ${RATHENA_TH_TEST_USER:-}
      RATHENA_TEST_PASSWORD: ${RATHENA_TH_TEST_PASSWORD:-}
      RATHENA_AGENT_USER: ${RATHENA_TH_AGENT_USER:-}
      RATHENA_AGENT_PASSWORD: ${RATHENA_TH_AGENT_PASSWORD:-}
      RATHENA_GM_USER: ${RATHENA_TH_GM_USER:-}
      RATHENA_GM_PASSWORD: ${RATHENA_TH_GM_PASSWORD:-}
      # entrypoint.sh installs it as db/import/map_cache.dat (read first; absent maps fall back).
      RATHENA_IMPORT_MAPCACHE: /opt/rathena-mapcache/map_cache.dat
    tmpfs:
      - /opt/rathena:rw,exec,nosuid,nodev,size=192m,uid=1000,gid=1000,mode=0755
    volumes:
      - ./data/mapcache-th:/opt/rathena-mapcache:ro
    networks:
      default:
        ipv4_address: 10.210.96.6 # = rathena's: the backend's only ingest peer, and the exclusion
    ports:
      - "${HOST_LAN_IP:-}:6900:6900" # login
      - "${HOST_LAN_IP:-}:6121:6121" # char
      - "${HOST_LAN_IP:-}:5121:5121" # map
    mem_limit: 1536m
    memswap_limit: 1536m

  sniffer-th:
    <<: *lab
    profiles: [th]
    image: poring-lab/sniffer:local
    pull_policy: never
    network_mode: "service:rathena-th"
    depends_on:
      rathena-th:
        condition: service_started
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      CAPTURE_IFACE: eth0
      CAPTURE_DIR: /captures
      INGEST_URL: ws://backend:8001/ingest/packets
      VALIDATION_USERIDS: ${RATHENA_TH_GM_USER:-}
      SNIFFER_SERVER_ID: lab-rathena-th
      PYTHONDONTWRITEBYTECODE: "1"
    # Its own captures (own retention: a shared directory would let one sniffer delete the other's
    # files). Never ./data, never vision (test_guards.py).
    volumes:
      - captures-th:/captures
    mem_limit: 256m
    memswap_limit: 256m

volumes:
  db-data:
  db-th-data:
  captures-th:
  x11-unix:
  # ADR-0007 packet captures: sniffer (rw) and backend (ro) ONLY -- never vision (test_guards.py).
  captures:
  # ADR-0004 file transfer: \\tsclient\transfer in Windows. RAM only (tmpfs, 512 MiB cap), never the
  # shared disk; emptied when both desktop and backend stop. Mounted in desktop + backend ONLY --
  # never vision, rathena or sniffer (tests/test_guards.py).
  # ADR-0009: Moonlight's client key + paired hosts = an input credential into Windows that would
  # bypass the mux if anything else could read it. Mounted in gamestream ONLY (tests/test_guards.py).
  gamestream-state:
  # S2 frame bus (docs/s2-plan.md): decoded console frames, RAM only. Written by gamestream ONLY,
  # read-only in backend and vision; nowhere else (tests/test_guards.py).
  framebus:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64m,uid=1000,gid=1000,mode=0750
  transfer:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=512m,uid=1000,gid=1000,mode=0770
  # The NAS datasets export (docs/operations/nas-sink.md), mounted by dockerd from the host (the
  # export admits only this VM), READ-ONLY and soft. Batt 2026-10-04: mounted in vision ONLY, for
  # training (tests/test_guards.py); the host's own mount stays the only writer.
  datasets-nas:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.1.6,nfsvers=4.2,ro,soft,timeo=150,retrans=3,noatime
      device: ":/mnt/tank-main/poring-lab/datasets"
  # S2 input socket (ADR-0014, S2 step 3): one unix socket, RAM only. An input path into Windows:
  # mounted in gamestream (the listener) and backend (the Injector) ONLY -- never vision, desktop or
  # anything else (tests/test_guards.py). The bot reaches it only through the mux.
  s2-input:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=1000,gid=1000,mode=0750

networks:
  # ADR-0005 option c2 (Batt, 2026-10-04): backend + vision only. internal: no route out; the
  # gateway isolated so vision cannot reach host services through it. PINNED 10.x, never 192.168.x.
  agent:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: 10.210.97.0/24
  default:
    # PINNED -- never let Docker pick this subnet. The daemon's fallback pools hand out 192.168.x.0/20
    # blocks, and on 2026-09-29 it gave this network 192.168.96.0/20, which overlaps the operator's LAN
    # segments behind the router (192.168.110-111) and cut the MacBook off from VM 103. Never use a
    # 192.168.x range on this host (LAN uses 192.168.1, 110, 111, 112 and 120).
    ipam:
      config:
        - subnet: 10.210.96.0/24
