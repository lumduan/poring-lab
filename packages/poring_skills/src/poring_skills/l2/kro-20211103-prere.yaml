# L2 bindings for ONE client build: how it does each L1 concept on screen (Batt, 2026-10-07).
# Numbers and names only: template PIXELS stay in data/ (gitignored), cut from the lab's frames.
# Every entry is unverified until a logged demonstration (shortcuts: the window appears) and then
# the concept's alone-test confirm it (docs/demonstrations.md).
client: kro-20211103-prere
profiles: [kro]  # ro_agent client profiles that run this build
build:
  exe_date: 2021-11-03
  packetver: 20211103
  renewal: false
  locales: [en]
shortcut:
  # status: unverified -> demonstrated (a logged demonstration, the window seen on its snapshots:
  # 20261007T124649-demo-shortcuts, record #NN) -> verified (open_window@1's alone-test passes).
  window:
    # paced chords (ro_agent CHORD_STEP_S, 60 ms); one instantaneous batch is ignored by the client
    status: {keys: [AltLeft, KeyA], status: demonstrated, evidence: shortcuts#00}
    skills: {keys: [AltLeft, KeyS], status: demonstrated, evidence: shortcuts#01}
    inventory: {keys: [AltLeft, KeyE], status: demonstrated, evidence: shortcuts#02}
    equipment: {keys: [AltLeft, KeyQ], status: demonstrated, evidence: shortcuts#03, also: [AltLeft, KeyX]}
    basic_info: {keys: [AltLeft, KeyV], status: demonstrated, evidence: shortcuts#04, note: toggles compact and full}
    party: {keys: [AltLeft, KeyZ], status: demonstrated, evidence: shortcuts#06, also: [AltLeft, KeyH]}
    guild: {keys: [AltLeft, KeyG], status: demonstrated, evidence: shortcuts#07}
    quest: {keys: [AltLeft, KeyU], status: demonstrated, evidence: shortcuts#13}
    chat_macros: {keys: [AltLeft, KeyM], status: demonstrated, evidence: shortcuts#14}
    emotions: {keys: [AltLeft, KeyL], status: demonstrated, evidence: shortcuts#15}
    command_list: {keys: [AltLeft, KeyY], status: demonstrated, evidence: shortcuts#17}
    chat_room: {keys: [AltLeft, KeyC], status: demonstrated, evidence: shortcuts#22}
    tipbox: {keys: [AltLeft, KeyD], status: demonstrated, evidence: shortcuts#24}
  system_menu: {keys: [Escape], status: demonstrated, evidence: shortcuts#27}
  sit: {keys: [Insert], status: demonstrated, evidence: shortcuts#26}
  # F12 CYCLES the bar's rows 1 -> 2 -> 3 -> 4 -> hidden -> 1 (f12-cycle demo, 2026-10-07): not
  # a toggle. The hotbar anchor is cut for 4 rows.
  hotbar_toggle: {keys: [F12], status: demonstrated, evidence: shortcuts#28, cycle: [1, 2, 3, 4, hidden]}
  hotbar: {keys: [F1, F2, F3, F4, F5, F6, F7, F8, F9], status: unverified}
  # no window seen for these on the GM (a level-1 novice): AltLeft + KeyW (cart: none yet), KeyJ
  # (pet), KeyR (homunculus), KeyI, KeyO, KeyT, KeyP, KeyB, KeyK, KeyN, KeyF -- not bound
window:
  # names in poring_env.ui_anchors (ADR-0011 anchor map); a window without a cut template there
  # resolves as unsupported
  basic_info: {anchor: basic_info, status: unverified}
  game_option: {anchor: game_option, status: unverified}
  minimap: {anchor: minimap, status: unverified}
  chat: {anchor: chat, status: unverified}
  # cut 2026-10-07 from the shortcut demonstrations (title text, 60x13; RDP: own 0.00 in both
  # scenes, nearest other window 16.6, max_distance 6). Not measured on S2.
  status: {anchor: status, status: unverified, measured_on: [rdp]}
  skills: {anchor: skills, status: unverified, measured_on: [rdp]}
  inventory: {anchor: inventory, status: unverified, measured_on: [rdp]}
  equipment: {anchor: equipment, status: unverified, measured_on: [rdp]}
element:
  hp_bar: {anchor_element: hp_bar, status: unverified}
  sp_bar: {anchor_element: sp_bar, status: unverified}
  minimap_xy: {anchor_element: minimap_xy, status: unverified}
game_option:
  # The in-game system menu (Escape = shortcut.system_menu), measured live 2026-10-10 03:33-03:35 ICT on
  # RDP (docs/demonstrations.md 3.34): five buttons on a 23 px pitch; the FIRST goes to character
  # select (one round trip measured: character select, then enter_game, interlock green again).
  # Box relative to the game_option anchor's origin (CAPTURE_ORIGINS (505,450)); its bottom button is
  # ui_anchors' game_option_close (30,113,220,20). With the chat input open, the first Escape only
  # closes the input: the route presses Escape once more if the window did not open.
  char_select: {box: [30, 18, 220, 20], status: unverified, measured_on: [rdp]}
skill_tree:
  # char.learn_skill on this build (learn_skill@1, docs/demonstrations.md 3.34). Measured 2026-10-09
  # 20:39-20:52 ICT on banked RDP frames of the GM, a Novice (look1-look6, local; `learn_skill1.py
  # prove` re-reads them). Numbers only: the templates (the confirm modal, the points label, the
  # level digit) are cut locally into data/ui_anchors/learn_skill/ (`learn_skill1.py cut`).
  # Boxes are [dx, dy, w, h], points [dx, dy]: relative to the `skills` window's origin (the
  # ADR-0011 anchor: its title bar's frame; home = client 378,200), EXCEPT `modal`: the client
  # centres the confirm modal on the CLIENT area (client pixels).
  # The raise is TENTATIVE: a click on a skill's icon draws a red +N right of it and colours the
  # points line; nothing is sent. APPLY opens the confirm modal; its OK sends the request(s).
  # RESET and the modal's CANCEL were never clicked (expected: drop the tentative raise / close
  # the modal, nothing sent -- unmeasured).
  window: skills
  status: unverified
  measured_on: [rdp]
  novice:
    # Basic Skill: the Novice column's first icon (highlighted while points remain)
    basic_skill:
      icon: [56, 42, 28, 28]
      click: [69, 56]  # the click proven live (look3)
      tentative: [84, 44, 17, 14]  # the red +N (look3: red ink at dx 84-97, dy 47-55)
      level: [62, 71, 16, 13]  # the level digit under the icon once applied (look5: a 1 at dx 67-72)
  points:
    # the points line: the weight readout's bitmap font (poring_env.weight's glyphs, 14x7 cells,
    # 7 px pitch); black when settled, coloured P-N(N) / P while a raise is tentative
    label: [61, 378, 66, 14]
    band: [127, 378, 85, 14]  # the glyph cells' rows; the number's first cell starts at first_cell
    first_cell: 130
  apply: [442, 373, 40, 20]
  reset: [492, 373, 40, 20]
  modal:
    box: [504, 300, 281, 120]
    ok: [694, 396, 40, 20]
    cancel: [739, 396, 41, 20]
camera:
  projection: {rdp: camera_rdp.json, s2: camera_console.json, status: unverified}
cue:
  # The walk marker drawn under a hovered walkable cell. The client draws it only on a SECOND
  # motion event at the spot (2026-10-07: one jump 0/18, a second move 18/18). An open chat does
  # not suppress it. Per path: rdp calibrated (walk_marker_calibrate.py); s2 NOT calibrated, so it
  # is absent and resolving it fails closed. Mirrored in scripts/rule_run.py (drift-tested).
  walk_marker:
    hover: {approach_px: 3, approach_s: 0.05, settle_s: 0.4}
    rdp:
      filter: green_v2
      min_marker_px: 60
      crop_px: 90
      # walk@4 (2026-10-07): the marker = four chevrons at the cell's CORNERS, inset ~0.4 cell
      # (cell units, measured on full markers in both scenes, pooled). Matching the visible
      # chevrons to these anchors names the picked cell even when a model hides some of them.
      corner_anchors: [[-0.42, -0.3], [0.4, -0.3], [0.4, 0.45], [-0.42, 0.45]]
    status: unverified
chat:
  # The client's REPEAT-PHRASE refusal (Batt 2026-10-09, ADR-0020 #10: "first test it ... and record
  # the real behaviour in L2 knowledge"). Measured live on RDP 2026-10-09 11:59-12:01 ICT with
  # scripts/chat_repeat_probe.py (crops in /dev/shm/poring-lab-tmp/chat-repeat, local):
  #   /where x7 in a row, nothing between (after one @heal): 3 answered, the 4th-7th DROPPED with no
  #   line at all (no refusal line for a slash command);
  #   "/ex" then "/where", x5: all 5 answered (a different slash command resets the count).
  # And 2026-10-08/09 (weight digits, 8592426): identical "@item" lines -- chat-sent lines -- were
  # refused WITH the red refusal line ("more than 3 times") even with "/ex" between them: a slash
  # command does NOT reset the chat-line count; unique lines (leading zeros) did.
  # THE FACT (measured): the client accepts 3 identical lines of a kind in a row; the 4th and later
  # are dropped (a slash command silently). Another line of the same kind resets the count -- a FACT
  # to record, NOT a technique to use (Batt 2026-10-09, `policy` below).
  repeat:
    max_identical_in_a_row: 3
    kinds:
      slash: {prefix: "/", dropped: silently, reset_by: another slash command}
      chat: {prefix: "", dropped: with the refusal line, reset_by: another chat line (a slash command does not)}
    status: verified
    verified_on: [{path: rdp, date: 2026-10-09, probe: scripts/chat_repeat_probe.py}]
  # THE POLICY (Batt 2026-10-09 ~12:15): "Players type /where once and are done; they don't
  # interleave filler commands." scripts/chat_guard.py enforces it for every rule, flow and tool:
  policy:
    no_separators: true  # never a line sent only to reset the repeat count (/ex or any filler)
    refuse_identical_in_a_row: 3  # the guard REFUSES the 3rd identical line in a row (and logs it)
    where_once_per_need: true  # no answer: no quick retype; passive sources first (minimap readout,
    #                            dead reckoning, landmarks), a retry only after where_retry_s, in budget
    where_retry_s: 60  # the shortest time between two /where (a human-like interval)
    where_budget_per_run: 12  # the default per run; a run sets its own (ADR-0020 #10's where_budget)
    min_line_interval_s: 0.5  # two typed lines closer than this: refused, never waited out
