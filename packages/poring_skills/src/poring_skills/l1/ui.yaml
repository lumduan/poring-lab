domain: ui
concepts:
  - id: ui.open_window
    purpose: Open a client window (character status, skill list, items, equipment, world map, options, basic info, cart).
    params: [window]
    steps:
      - Press the window's keyboard shortcut (a modifier chord in most builds), or click its button on the basic info window.
    preconditions:
      - The client is in front and accepts keys; the window is closed (most shortcuts toggle).
    failure_modes:
      - The chord is sent too fast and the client ignores it.
      - The shortcut toggles an already open window closed.
      - The client lacks textures for the window and shows a modal error instead.
    outcome:
      runtime:
        kind: screen
        signal: the window's anchor is absent before and present after
      offline:
        kind: none
        signal: client-side only (no packet)
    exceptions:
      - Builds differ in which shortcuts exist and in whether a window is a separate window or a tab.
    bindings_needed: [L2.shortcut.window, L2.window]
    workflow_wave: 1
    verified_on:  # both scenes (outdoor + indoor), 50/50 each; interrupted attempts re-run
      - client: kro-20211103-prere
        server: lab-rathena
        locale: en
        path: rdp
        session: 20261007T135624-demo-window-alone-outdoor
        rule: open_window@1
        date: "2026-10-07"
      - client: kro-20211103-prere
        server: lab-rathena
        locale: en
        path: rdp
        session: 20261007T140603-demo-window-alone-indoor
        rule: open_window@1
        date: "2026-10-07"
  - id: ui.close_window
    purpose: Close a client window.
    params: [window]
    steps:
      - Press the same shortcut again, or click the window's close button, or Escape when it has focus.
    failure_modes:
      - Escape opens the system menu instead when no window has focus.
    outcome:
      runtime:
        kind: screen
        signal: the window's anchor is present before and absent after
      offline:
        kind: none
        signal: client-side only
    bindings_needed: [L2.shortcut.window, L2.window, L2.element]
    workflow_wave: 1
  - id: ui.press_button
    purpose: Press a button inside a window (OK, a stat raise button, a tab).
    params: [window, button]
    steps:
      - Locate the window by its anchor, then click the button at its offset inside the window.
    preconditions:
      - The window is open and not covered by another window.
    failure_modes:
      - The window moved or is covered, so the offset hits something else.
    outcome:
      runtime:
        kind: screen
        signal: the state change the button is for (per button)
      offline:
        kind: packets
        signal: per button (some buttons send a request, others are client-side)
    bindings_needed: [L2.window, L2.element]
    workflow_wave: 1
  - id: ui.press_hotkey
    purpose: Press one hotbar key (row 1, F1-F9); whatever the player put on that slot is used (an item, a skill, equipment, a wing).
    params: [key]
    steps:
      - Press the slot's key once (down, then up); the client uses what the slot holds.
    preconditions:
      - The client is in front and accepts keys; the chat input is closed; the hotbar shows row 1.
    failure_modes:
      - The slot is empty, so nothing happens.
      - A skill on the slot is still on its cooldown (or the cast delay), so the client refuses it.
      - The chat input is open and swallows the key.
      - The slot holds something other than what the flow assumes (the player moved it).
    game_rules:
      - What a slot holds is the player's choice; the key alone says nothing about it.
    outcome:
      runtime:
        kind: none
        signal: none of its own -- the slot's content decides the effect (an item count drops, the SP bar drops, a map loads); the step that presses it checks that effect
      offline:
        kind: packets
        signal: the request the slot's content sends (an item use, a skill use, an equip)
    exceptions:
      - Builds differ in how many slots a row has and which keys press them (L2.shortcut.hotbar).
    bindings_needed: [L2.shortcut.hotbar]
