# The block registry (ADR-0020 section 2): what L1 does not hold. Our own words and numbers only.
#
# The CATALOGUE (poring_flow.catalogue) joins this registry with the L1 concepts
# (packages/poring_skills/src/poring_skills/l1/*.yaml): each block's L1 purpose, preconditions,
# runtime outcome, bindings and status. A block whose concept is not in L1 is marked UNKNOWN; an
# L1 concept that is neither a block's, a sensor's nor excluded here fails the coverage test.
#
# Per block:
#   concept      its L1 concept (core.* = a core block: no input, proven by unit tests)
#   params       name, type, required, positional (the Python view prints it positionally)
#   timeout_s    the default timeout (the IR stores the value; the Python view omits the default)
#   profile      anywhere | atomic: where a pre-emption may halt it (2.5 rule 5)
#   long         a long action (a WARNING inside a critical event, section 5)
#   moves        none | to_cell | near: where the character is afterwards (route simulation)
#   changes_map  never | always | by_item | escape (13.6.9 relocating events)
#   adds_weight  it can raise weight_percent() (13.5 weight rule)
#   insertable   may run as an INSERT: Batt 2026-10-08 (Q17), the hotbar ONLY (use_item, press_key)
#   irreversible why the owner must acknowledge it at approval (section 5)
#   kafra        the Kafra service it needs (13.5)
#   assume       L1 preconditions that must be in the flow's `assumes` (13.5)
#   affects      sensors it moves: + up, - down, ~ either way (loops, re-trigger)
#   types        it types (the foreground gate applies)
#   needs_targets it attacks the map block's TARGET species only: a map block with targets (13.3)
#   live         the LIVE BLOCK PLAYER plays it in the real game (scripts/flow_play.py; Batt
#                2026-11-13, docs/planning/live-blocks.md stage 1, ADR-0020 Amendment E). The ONE
#                place the live set is written, with poring_flow/live.py's statement kinds and
#                exits; every block or sensor without it is refused BEFORE ANY INPUT, by name
# Parameter types: cell map npc option item items mob skill window int float bool str value, and
#   proc: a FUNCTION's name (a string literal naming a procedure; Batt 2026-11-13, Amendment C)
# Per parameter, besides name / type / required / positional:
#   group        its group in the editor (Batt D2, 2026-10-21: one hunt block with groups)
#   choices      the RULE VERSIONS a person may pick (name@N: PARAMS[N]'s numbers, read-only;
#                scripts/hunt_config.py, config/flows/hunt/index.yaml); the linter refuses others
#   options      plain OPTION values (no @N: not a PARAMS rule, no numbers travel with it); the
#                linter refuses others (Batt 2026-10-22: the hunt block's engage_source)
#   default      what an ABSENT option parameter means (never required: old flows keep their hash)
#   note         the editor's text beside an option parameter
version: 1
blocks:
  walk_to:
    concept: nav.walk_to
    params: [{name: cell, type: cell, required: true, positional: true}]
    timeout_s: 120
    long: true
    moves: to_cell
    affects: {position: "~", sees: "~", count_visible: "~", engaged_species: "~"}
  walk_away:
    concept: nav.walk_to
    params: [{name: min_cells, type: int}]
    timeout_s: 30
    long: true
    moves: near
    affects: {position: "~", sees: "~", count_visible: "~"}
    note: walk at least min_cells away from the engaged unit (13.9); NOT yet proven to stop an attack (open question 32)
  take_warp:
    concept: nav.take_warp
    params: [{name: to, type: map, required: true, positional: true}]
    timeout_s: 60
    long: true
    moves: near
    changes_map: always
  kafra_teleport:
    concept: nav.kafra_teleport
    params:
      - {name: npc, type: npc, required: true, positional: true}
      - {name: to, type: map, required: true}
    timeout_s: 60
    long: true
    profile: atomic
    changes_map: always
    kafra: teleport
    affects: {zeny: "-"}
  ride_transport:
    concept: nav.take_transport
    params:
      - {name: npc, type: npc, required: true, positional: true}
      - {name: to, type: map, required: true}
    timeout_s: 300
    long: true
    changes_map: always
  set_save_point:
    concept: nav.set_save_point
    params: [{name: npc, type: npc, required: true, positional: true}]
    timeout_s: 60
    long: true
    profile: atomic
    moves: near
    kafra: save
  escape:
    concept: nav.escape
    params: []
    timeout_s: 10
    changes_map: escape
    note: hp_critical's FIXED body (13.6.8) -- a Fly Wing where the map allows it, else a Butterfly Wing, else stop
  read_position:
    concept: nav.read_position
    params: []
    timeout_s: 10
    types: true
    note: the ACTIVE /where read (13.6.6); it types, through the mux and the foreground gate
  talk_npc:
    concept: npc.talk
    params: [{name: npc, type: npc, required: true, positional: true}]
    timeout_s: 60
    long: true
    moves: near
    affects: {dialog_shows: "~", window_open: "~"}
  next_page:
    concept: npc.next
    timeout_s: 10
    affects: {dialog_shows: "~"}
  choose_menu:
    concept: npc.choose
    params: [{name: option, type: option, required: true, positional: true}]
    timeout_s: 10
    profile: atomic
    affects: {dialog_shows: "~"}
  enter_value:
    concept: npc.input
    params: [{name: value, type: value, required: true, positional: true}]
    timeout_s: 20
    profile: atomic
    types: true
  close_dialog:
    concept: npc.close
    timeout_s: 10
    affects: {dialog_shows: "~", window_open: "~"}
    # Batt 2026-10-09 (ADR-0020 contradictions #7): THE one dialog-close block. close_npc_dialog
    # is only a Python-import alias of it (pyview.ALIASES, with a warning), never a block.
    note: IDEMPOTENT -- closes the dialog IF one is open (13.9's recovery included); ok when none is
  attack_nearest:
    concept: combat.attack_target
    params:
      - {name: mob, type: mob, positional: true}
      - {name: within, type: int}
    timeout_s: 120
    long: true
    moves: near
    affects: {hp_percent: "-", sp_percent: "~", base_level: "+", job_level: "+", sees: "~", count_visible: "~", engagement_seen: "~"}
    note: in a map block without a mob it attacks only the block's TARGET species (13.3)
  dungeon_hunt:
    # Batt 2026-11-13 ("the xmas_dun02 flow must be an ordinary map block"; ADR-0020 Amendment C):
    # the Rogue's RUNNER (scripts/dungeon_hunt.py, as scripts/flow_run.py starts it) as ONE
    # task-level block in a map node, like `hunt` below. Its parameters are a person's choices:
    # the FUNCTION the runner presses for each role, each exactly one press_key (lint/functions.py:
    # four different keys, none the Butterfly Wing's). Every other technique stays the runner's
    # own setting (scripts/flow_config.py: the /flows Run settings). It runs only on a map that
    # has a runner (poring_flow.functions.RUNNER_MAPS: flow_run.py FLOWS' maps, drift-tested).
    # The runner reads its own map's zones and targets, so it needs no TARGET list here.
    concept: combat.hunt
    params:
      - {name: heal, type: proc, required: true, group: keys, note: "the function the runner presses to heal: one press_key, the heal item's hotbar key (its default F1)"}
      - {name: fly, type: proc, required: true, group: keys, note: "the function the runner presses for a Fly Wing (a jump on this map): one press_key (its default F8)"}
      - {name: knife_on, type: proc, required: true, group: keys, note: "the function the runner presses to wield the Knife: one press_key (its default F4); stage 3: or a body of presses and waits the hunt core calls at that moment, its first press the key"}
      - {name: knife_back, type: proc, required: true, group: keys, note: "the function the runner presses to wield the dagger again: one press_key (its default F5); stage 3: or a body of presses and waits the hunt core calls at that moment, its first press the key"}
      # ➡️ Batt 2026-11-13 ~21:4x (the one box, START > xmas_dun02): the runner flies HOME itself, on
      # a Butterfly Wing (the bag half full, or Stop: its settings), so a fifth role names that
      # function. Optional: without it the map's item warp by function gives the home key, as before
      # (poring_flow.project.runner_keys). Its function is a Butterfly Wing function (its key a wing key).
      - {name: home, type: proc, group: keys, note: "the function the runner presses to fly home on a Butterfly Wing (the bag half full, or Stop): one press_key (its default F9); absent: the map's item warp by function"}
      # ➡️ Batt 2026-11-13 ("make respawn a function block, in case another server's menu differs;
      # make everything editable in blocks, don't hard-code"; live-blocks.md stage 3, ADR-0020
      # Amendment G): the death exit's two presses as FUNCTIONS of click_at. Optional: without
      # `respawn` the runner presses its own points (the Run settings' respawn_at /
      # respawn_confirm_at); with it, `respawn_confirm` absent = this server asks no confirmation.
      # Stage 3 also lets knife_on, knife_back and home be a BODY of presses and waits (the hunt core
      # calls it at its own moment; poring_flow.functions.BODY_ROLES).
      - {name: respawn, type: proc, group: exits, note: "the function the hunt core calls after a death to press the death dialog's button (move to the saved location): click_at and wait only; absent: the runner's own point (the Run settings)"}
      - {name: respawn_confirm, type: proc, group: exits, note: "the function it calls when the confirmation reads after that press (this client: OK): click_at and wait only; absent with respawn: this server asks none"}
    timeout_s: 600
    long: true
    moves: near
    adds_weight: true
    live: true  # stage 1: the hunt core, the runner's play IN-PROCESS (flow_play.py; one input writer)
    affects: {position: "~", hp_percent: "-", base_level: "+", job_level: "+", weight_percent: "+", item_count: "+", sees: "~", count_visible: "~", engagement_seen: "~"}
    note: the stop group is the enclosing loop (13.5) -- its condition and max_s; one call hunts at most timeout_s. Each parameter names a FUNCTION of exactly one press_key (the runner presses one key a role; home, optional, is the Butterfly Wing it flies home on); only on a map with a runner (xmas_dun02)
  hunt:
    # Amendment A 3 (DRAFT; Batt D2 2026-10-21: one `hunt` block with groups): hunt-flow's ADOPTED
    # rules as ONE task-level block inside a map node. Its parameters are a person's choices, each
    # a rule version; gates, safety, readers and constants stay in the engine (never a parameter).
    # The choices are the adopted base's (v52, config/flows/hunt/v52.yaml) and the alternatives
    # the plan names that exist as versions; another value is a new version, pre-registered.
    # ➡️ The adopted base is v55 since 2026-10-22 04:32 (3.97): its loot rule gm_fast_scan@54
    # joins the loot choices (first: the adopted one); the other rules are v52's, unchanged.
    # ➡️ engage_source (Batt 2026-10-22 ~13:45): WHO finds what to strike -- the detector (the
    # default; absent = detector) or the MELEE RING (the client's cursor reads SWORD over the 8
    # cells around the character). An OPTION, not a rule version: it is no hunt_flow PARAMS rule
    # (its runtime is scripts/dungeon_hunt.py `--engage melee_ring`). melee_ring strikes EVERY
    # monster in melee range, so lint/hunt.py refuses it on a map with an IGNORE list or a
    # non-TARGET species and on any server but the lab's; runstart.py refuses it unless the
    # attested environment is the lab's. The NPC sprite guard and every gate stay underneath.
    # ➡️ search_route (Batt 2026-10-22, the Crusader's orcsdun01 demo): HOW the hunt searches
    # between fights -- the heading search (the default; absent = heading: the `search` rule's
    # numbers) or the map's reviewed PATROL ROUTE (config/routes/<map>.yaml, its first route,
    # scripts/map_routes.py), walked in its listed direction; after a fight or a loot step the walk
    # resumes at the NEXT waypoint AHEAD, never a passed one. An OPTION, not a rule version: no
    # hunt_flow PARAMS rule holds it. lint/hunt.py refuses patrol_route on a map with no routes
    # file or one the loader refuses; runstart.py refuses it without the routes provider.
    concept: combat.hunt
    params:
      - {name: strike, type: str, required: true, group: engage, choices: [arm_c@32]}
      - {name: engage_on_the_way, type: str, required: true, group: engage, choices: [on_the_way@19]}
      - name: engage_source
        type: str
        group: engage
        options: [detector, melee_ring]
        default: detector
        note: "detector: the detector's boxes pick the target (the default). melee_ring: the cursor picks it -- every SWORD in the 8 cells around the character, struck at once, the next queued; NPCs read TALK and are never struck. Lint refuses melee_ring on a map with an IGNORE list or any non-TARGET species, and on any server but the lab's"
      - {name: dead, type: str, required: true, group: dead_loot, choices: [exp_line@48]}
      - {name: loot, type: str, required: true, group: dead_loot, choices: [gm_fast_scan@54, gm_scan_one_pass@51, gm_scan@50]}
      - {name: search, type: str, required: true, group: search, choices: [heading_coverage@22]}
      - name: search_route
        type: str
        group: search
        options: [heading, patrol_route]
        default: heading
        note: "heading: the heading search with the search rule's numbers (the default). patrol_route: walk the map's reviewed patrol route (config/routes/<map>.yaml, its first route) continuously in its listed direction; a fight or a loot step interrupts it, then the walk resumes at the NEXT waypoint AHEAD, never a passed one. Lint refuses patrol_route on a map with no routes file, or one its loader refuses"
    timeout_s: 600
    long: true
    moves: near
    adds_weight: true
    needs_targets: true
    affects: {position: "~", hp_percent: "-", base_level: "+", job_level: "+", weight_percent: "+", item_count: "+", sees: "~", count_visible: "~", engagement_seen: "~"}
    note: the stop group is the enclosing loop (13.5) -- its condition and max_s; one call hunts at most timeout_s. The map node's targets / ignore and its zones are the block's (13.3, Amendment A 4)
  finish_target:
    concept: combat.attack_target
    timeout_s: 60
    long: true
    moves: near
    affects: {hp_percent: "-", base_level: "+", job_level: "+", sees: "~", count_visible: "~", engagement_seen: "~"}
    note: attack the unit we are engaged with until it dies (13.9's finish policy)
  use_skill:
    concept: combat.use_skill
    params:
      - {name: skill, type: skill, required: true, positional: true}
      - {name: target, type: mob}
    timeout_s: 30
    affects: {sp_percent: "-", hp_percent: "~", base_level: "+", job_level: "+"}
  loot:
    concept: loot.pick_up
    params: [{name: item, type: item, positional: true}]
    timeout_s: 30
    moves: near
    adds_weight: true
    affects: {weight_percent: "+", item_count: "+"}
    note: Batt 2026-10-08 (Q21) -- a hover-scan around the death cell for the PICKUP cursor; verified by the weight readout rising
  buy:
    concept: trade.buy
    params:
      - {name: npc, type: npc, required: true, positional: true}
      - {name: items, type: items, required: true}
    timeout_s: 60
    adds_weight: true
    affects: {zeny: "-", weight_percent: "+", item_count: "+"}
  sell:
    concept: trade.sell
    params:
      - {name: npc, type: npc, required: true, positional: true}
      - {name: keep, type: items, required: true}
    timeout_s: 60
    irreversible: sells every item not on the keep list
    affects: {zeny: "+", weight_percent: "-", item_count: "-"}
  kafra_store:
    concept: storage.deposit
    params:
      - {name: npc, type: npc, required: true, positional: true}
      - {name: items, type: items}
      - {name: all_except, type: items}
    timeout_s: 120
    long: true
    profile: atomic
    kafra: storage
    assume:
      - {sensor: skill_level, skill: 1, op: ">=", value: 6, why: "storage.deposit: Basic Skill level 6"}
    affects: {weight_percent: "-", item_count: "-", zeny: "-"}
  kafra_withdraw:
    concept: storage.withdraw
    params:
      - {name: npc, type: npc, required: true, positional: true}
      - {name: items, type: items, required: true}
    timeout_s: 120
    long: true
    profile: atomic
    kafra: storage
    adds_weight: true
    assume:
      - {sensor: skill_level, skill: 1, op: ">=", value: 6, why: "storage.withdraw: Basic Skill level 6"}
    affects: {weight_percent: "+", item_count: "+", zeny: "-"}
  use_item:
    concept: item.use
    params: [{name: item, type: item, required: true, positional: true}]
    timeout_s: 10
    insertable: true
    changes_map: by_item
    affects: {hp_percent: "+", sp_percent: "+", item_count: "-", weight_percent: "-"}
  press_key:
    # Batt 2026-11-13 ("Fly Wing and Butterfly Wing must not be written as fixed items: make them
    # FUNCTIONS whose body says which shortcut key to press; the Knife swap, casting skills or
    # anything else the same way"; ADR-0020 Amendment C): ONE key of the hotbar's row 1, never any
    # other key (2.1 keeps raw keys out): the options are L2.shortcut.hotbar's, the keys the
    # runner reads (scripts/flow_config.py KEYS). What the slot holds is the player's, so the
    # linter reads a press conservatively (lint/functions.py): a key a Butterfly Wing function
    # presses IS that wing (the save-point rule, then relocate or stop); changes_map by_item and
    # every vital "~" so nothing behind a press is taken for harmless.
    concept: ui.press_hotkey
    params:
      - {name: key, type: str, required: true, positional: true, options: [F1, F2, F3, F4, F5, F6, F7, F8, F9], note: "the hotbar key (row 1): whatever is on that slot is used -- an item, a skill, equipment or a wing"}
    timeout_s: 2
    insertable: true
    changes_map: by_item
    live: true  # stage 1: ro_agent's paced key tap (down, 50 ms, up), through the mux
    affects: {hp_percent: "~", sp_percent: "~", item_count: "~", weight_percent: "~"}
    note: a hotbar press, the one Batt's 2026-10-08 Q17 allows as an INSERT (as use_item's hotbar use). Whatever the slot holds is used; a key a Butterfly Wing function presses counts as that wing (the save-point rule; an event that presses it relocates or stops)
  equip:
    concept: item.equip
    params: [{name: item, type: item, required: true, positional: true}]
    timeout_s: 15
  unequip:
    concept: item.unequip
    params: [{name: item, type: item, required: true, positional: true}]
    timeout_s: 15
  insert_card:
    concept: item.insert_card
    params:
      - {name: card, type: item, required: true, positional: true}
      - {name: item, type: item, required: true, positional: true}
    timeout_s: 20
    profile: atomic
    irreversible: is permanent
  refine:
    concept: item.refine
    params:
      - {name: npc, type: npc, required: true, positional: true}
      - {name: item, type: item, required: true, positional: true}
    timeout_s: 60
    profile: atomic
    irreversible: can destroy the item
  open_window:
    concept: ui.open_window
    params: [{name: window, type: window, required: true, positional: true}]
    timeout_s: 10
    affects: {window_open: "+"}
  close_window:
    concept: ui.close_window
    params: [{name: window, type: window, required: true, positional: true}]
    timeout_s: 10
    affects: {window_open: "-"}
  press_button:
    concept: ui.press_button
    params:
      - {name: window, type: window, required: true, positional: true}
      - {name: button, type: str, required: true, positional: true}
    timeout_s: 10
  click_at:
    # Batt 2026-11-13 (live-blocks.md stage 3, ADR-0020 Amendment G): ONE click at a point of the
    # game picture (game-region pixels, 1280 x 720), as the runner's own respawn press clicks: two
    # motions, then the click (the client ignores a cold click). LIVE only inside dungeon_hunt's
    # respawn functions, in its death exit (poring_flow.live: refused before any input anywhere
    # else; a person-written click in the world is stage 4's question). Its binding is the
    # runner's own press (live.OWN_BINDING).
    concept: ui.press_button
    params:
      - {name: x, type: int, required: true, positional: true, note: "game-region pixels from the left, 0-1279"}
      - {name: y, type: int, required: true, positional: true, note: "game-region pixels from the top, 0-719"}
    timeout_s: 2
    live: true  # stage 3: in the hunt core's death exit only (the respawn functions)
    note: a click at a fixed point of the game picture (a dialog's button); two motions, then the click. Live only inside dungeon_hunt's respawn and respawn_confirm functions
  sit:
    concept: char.sit
    timeout_s: 5
  stand:
    concept: char.stand
    timeout_s: 5
  raise_stat:
    concept: char.allocate_stat
    params:
      - {name: stat, type: str, required: true, positional: true}
      - {name: count, type: int}
    timeout_s: 20
  learn_skill:
    concept: char.learn_skill
    params:
      - {name: skill, type: skill, required: true, positional: true}
      - {name: count, type: int}
    timeout_s: 20
  respawn:
    concept: char.respawn
    timeout_s: 30
    changes_map: always
    affects: {is_dead: "-", hp_percent: "+"}
  rent_cart:
    concept: cart.rent
    params: [{name: npc, type: npc, required: true, positional: true}]
    timeout_s: 60
    kafra: cart
  cart_transfer:
    concept: cart.transfer
    params:
      - {name: items, type: items, required: true, positional: true}
      - {name: direction, type: str, required: true}
    timeout_s: 30
    affects: {weight_percent: "~", item_count: "~"}
  change_job:
    concept: char.change_job
    params: [{name: job, type: str, required: true, positional: true}]
    timeout_s: 600
    long: true
    note: a PROCEDURE per server in practice (section 10); the block is the outcome check
  login:
    # The project model (Batt 2026-11-13, docs/planning/project-model.md sections 1 and 5): a LOGIN
    # node's main is this one block, like n8n's credentials by NAME. SIMULATED ONLY: Run starts on
    # a map node with the character in the game; the bot's real login stays ro_agent's Python
    # (scripts/ro_agent.py to_char_select). Before a map session exists the interlock is red, so no
    # flow ever sends this input (ADR-0016). `server` is an environment id of the Settings page
    # (config/environments.yaml); `credential` a NAME, never a secret (lab_gm, lab_player: the .env
    # accounts ro_agent reads). project.py's lint: only on a login node's main.
    concept: session.login
    params:
      - {name: server, type: str, required: true, note: "an environment id of the Settings page (config/environments.yaml); the bot acts only on lab-rathena"}
      - {name: credential, type: str, required: true, note: "a credential by NAME (lab_gm, lab_player), never a secret: ro_agent reads the account from the server's .env"}
    timeout_s: 60
    long: true
    types: true
    note: "simulated only: Run starts on a map node; the bot's real login is ro_agent's"
  choose_character:
    # The project model: a CHARACTER node's main is this one block. SIMULATED ONLY, as login.
    # Absent slot: the slot the client remembers (ro_agent enter_game presses Enter on it); absent
    # name: the account's own character (.env). project.py's lint: only on a character node's main.
    concept: session.select_char
    params:
      - {name: slot, type: int, note: "1-15; absent: the slot the client remembers"}
      - {name: name, type: str, note: "the character's name (letters, digits, spaces, _; at most 23); absent: the account's own"}
    timeout_s: 60
    long: true
    note: "simulated only: Run starts on a map node; the bot's real login is ro_agent's"
  assert_save_point:
    concept: core.assert_save_point
    kind: core
    params: [{name: cell, type: cell, required: true, positional: true}]
    timeout_s: 1
    live: true  # stage 1: no input (the author's assertion), as in the simulator
    note: the AUTHOR asserts the save point (13.5); no input; stays a visible warning at approval

# Sensors (2.3): every one reads pixels. A sensor whose read concept is not in L1 yet is UNKNOWN
# (open question 7: new read concepts go through L1 and the alone-test like any other).
#   type     percent | int | bool | mob | map | cell
#   passive  false = ACTIVE (it needs input to read): never in an event condition
#   drift    it changes without our input (regeneration, damage, movement): loops may wait on it
#   cue      a momentary cue (true for an instant): it cannot hold on every tick
#   danger   low | high: which side of a threshold is the dangerous one ("looser", 13.6.9)
#   live     the live block player reads it from pixels (stage 1: HP / SP / weight, the death
#            dialog, the map's name from the minimap; stage 2: sees_boss, inside a hunt core)
sensors:
  hp_percent: {concept: vitals.read, type: percent, passive: true, live: true, drift: true, range: [0, 100], resolution: 1, danger: low}
  sp_percent: {concept: vitals.read, type: percent, passive: true, live: true, drift: true, range: [0, 100], resolution: 1, danger: low}
  weight_percent: {concept: vitals.read, type: percent, passive: true, live: true, range: [0, 100], resolution: 1, danger: high}
  zeny: {concept: vitals.read, type: int, passive: true, range: [0, 2000000000]}
  position: {concept: nav.read_position, type: cell, passive: false, note: "the /where read types (13.6.6)"}
  current_map: {concept: nav.read_position, type: map, passive: false, live: true, note: "the /where read types (13.6.6); the LIVE player reads the map's NAME from the minimap's picture instead (minimap_id.py: no input)"}
  base_level: {type: int, passive: true, range: [1, 999], note: "a new L1 read concept, not written yet"}
  job_level: {type: int, passive: true, range: [1, 999], note: "a new L1 read concept, not written yet"}
  item_count: {type: int, passive: false, params: [{name: item, type: item, required: true, positional: true}], note: "opens the inventory"}
  skill_level: {type: int, passive: false, params: [{name: skill, type: skill, required: true, positional: true}], note: "opens the skill window; for assumes"}
  sees: {type: bool, passive: true, drift: true, params: [{name: mob, type: mob, required: true, positional: true}, {name: within, type: int}], note: "the world detector + tracker (Phase 3)"}
  count_visible: {type: int, passive: true, drift: true, params: [{name: mob, type: mob, required: true, positional: true}, {name: within, type: int}], note: "the world detector + tracker (Phase 3)"}
  is_dead: {concept: char.respawn, type: bool, passive: true, drift: true, live: true, note: "the death dialog's anchor (char.respawn's L2 binding)"}
  window_open: {concept: ui.open_window, type: bool, passive: true, params: [{name: window, type: window, required: true, positional: true}]}
  dialog_shows: {concept: npc.choose, type: bool, passive: true, params: [{name: option, type: option, required: true, positional: true}]}
  map_load_seen: {type: bool, passive: true, drift: true, cue: true, live: true, note: "the loading screen or the map-load notice (open question 28); the LIVE player: the minimap names another map than the last one it named"}
  # Batt 2026-11-13 (docs/planning/live-blocks.md stage 2: "Fly Wing: press F8 when a boss is seen or
  # HP < 25 %"): the hunt core's OWN boss read as a sensor. Live ONLY inside a hunt core (its tick
  # hook: dungeon_hunt.HuntTick.boss); anywhere else it is unknown (None), so it never fires there.
  # Not "boss_seen": that name is a map event of the IR 2 samples (town_warp_farm, farm_loop).
  sees_boss: {type: bool, passive: true, drift: true, cue: true, live: true, note: "the hunt core's boss read on this tick: a Battle Log line (damage or taken) whose bracketed name fits the map's boss or one of its summons (dungeon_hunt boss_of over boss_names; the runner's --engage-screen boss guard). Read only while the hunt core plays; elsewhere unknown"}
  engagement_seen: {type: bool, passive: true, drift: true, cue: true, note: "an engagement we did not order, from pixels (13.9)"}
  engaged_species: {type: mob, passive: true, drift: true, note: "needs a detector that names species (13.9, open question 33)"}
  # The TRAINED MODELS as sensors (Batt 2026-11-09; models.yaml, ADR-0020 Amendment B): `model` is a
  # catalogue model id, `label` one of its classes, both written as text (lint/detectors.py)
  detector_sees: {type: bool, passive: true, drift: true, params: [{name: model, type: str, required: true, positional: true}, {name: label, type: str, required: true, positional: true}], note: "True when the model boxes that class in the frame (models.yaml)"}
  detector_count: {type: int, passive: true, drift: true, range: [0, 999], params: [{name: model, type: str, required: true, positional: true}, {name: label, type: str, required: true, positional: true}], note: "how many boxes of that class the model finds (a detector only, models.yaml)"}

# L1 concepts that are neither a block nor a sensor (the coverage test). session.login and
# session.select_char are blocks since the project model (2026-11-13): login / choose_character.
excluded:
  session.logout: it ends the map session a flow runs in; logging out stays a host tool's step (ADR-0016).
