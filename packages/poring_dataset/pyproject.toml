[project]
name = "poring-dataset"
version = "0.1.0"
description = "poring-lab Phase 2: recordings, packet-to-frame alignment, walkability, projection and auto-labels -- OFFLINE ONLY (ADR-0010); never imported by poring_env or vision at decision time."
requires-python = ">=3.12"
# Built on the offline packet ground truth (ADR-0007) and numpy; nothing GPU, nothing live.
dependencies = ["poring-packets", "numpy>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
