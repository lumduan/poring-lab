[project]
name = "poring-packets"
version = "0.1.0"
description = "poring-lab Phase 1: passive rAthena packet capture and decoding -- OFFLINE GROUND TRUTH ONLY (ADR-0007), never agent input."
requires-python = ">=3.12"
# Pure Python + pydantic: the dev-overlay sniffer runs on the backend image without installing it.
dependencies = ["pydantic>=2.13"]

[project.optional-dependencies]
# The sniffer streams events to the backend's /ingest/packets.
sniffer = ["websockets>=17.1"]

[project.scripts]
# Prints the packet-event JSON Schema; scripts/gen_protocol.sh commits it and derives packets.gen.ts.
poring-packets-schema = "poring_packets.events:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# _generated/ is gitignored -- generated from pinned sources, never committed (ADR-0007) -- and
# hatch leaves ignored files out of a wheel. The slim sniffer image installs this package
# non-editable, so the table must ship as an artifact (its build refuses a missing/drifted table).
artifacts = ["src/poring_packets/_generated/*.json"]
