# ADR-0022: the Intel overlay for the long-lived vision worker (bot-server's Arc A380), the
# worker's twin of compose.intel.yaml. guarded_build adds it LAST, after compose.vision-worker.yaml,
# when the host profile is dedicated-intel. The same three changes, nothing else
# (tests/test_guards.py): the Intel image, the DRM render node + render group instead of the NVIDIA
# reservation, PORING_ACCEL=xpu with no VRAM cap by default. Plus, the worker only: its memory
# cap (Batt 2026-11-08, a dedicated host).
services:
  vision-worker:
    image: poring-lab/vision-intel:local
    deploy: !reset {}
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-991}" # the host's `render` group: getent group render
    environment:
      PORING_ACCEL: xpu
      VISION_MAX_VRAM_FRACTION: ${VISION_MAX_VRAM_FRACTION:-1.0}
    # Batt 2026-11-08 ("raise it"): bot-server is dedicated (15 GiB), so the worker's cap goes
    # 6g -> 11g: the trainer holds ~5.2 GB itself, and its data-loader workers OOM-killed at
    # 6 GB (bot-server-migration.md 17a). mem == memswap, as everywhere.
    mem_limit: 11g
    memswap_limit: 11g
