[project]
name = "poring-vision"
version = "0.1.0"
license = "AGPL-3.0-only"  # ADR-0018
description = "poring-lab vision agent: grab -> infer -> decide -> act through the backend mux (GPU container)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "poring-env[x11,remote]",
  # Resolved from the root's explicit `pytorch-cu130` index -> 2.14.0+cu130 (sm_120 kernels).
  "torch==2.14.0",
  "torchvision==0.29.0",
  "ultralytics==8.4.165",
  # Replaces ultralytics' GUI `opencv-python` (excluded at the root). <5: ultralytics has not
  # declared OpenCV 5 support yet.
  "opencv-python-headless>=4.10,<5",
  # The detect server's onnxruntime backend (ADR-0022 Amendment 2026-11-18): the deployed ONNX on
  # NVIDIA's CUDA provider. Built for CUDA 13 like torch cu130, whose nvidia-* wheels (cudart 13.0,
  # cuBLAS 13, cuDNN 9 cu13, cuFFT 12, cuRAND 10, NVRTC 13) it shares: no second CUDA stack.
  "onnxruntime-gpu[cuda,cudnn]==1.31.1",
]

[project.scripts]
poring-vision = "poring_vision.loop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
