[project]
name = "poring-backend"
version = "0.1.0"
license = "Apache-2.0"  # ADR-0018
description = "poring-lab backend: screen stream, input mux (the single XTest writer), internal agent API."
requires-python = ">=3.12"
dependencies = [
  "poring-env[x11]",
  "poring-packets",
  "fastapi>=0.141",
  "uvicorn[standard]>=0.54",
  "pydantic-settings>=2.10",
  "simplejpeg>=1.9",
  "pyyaml>=6",  # the ADR-0016 allowlist (already in the image through uvicorn[standard])
]

[project.scripts]
poring-backend = "poring_backend.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
