# poring-lab: copied verbatim into conf/import/groups.yml by entrypoint.sh at every start (no
# variables). Merged on top of the stock conf/groups.yml by its Footer import.
#
# Group 20 "Validation" -- the agent's GM account (RATHENA_GM_USER), used ONLY for Phase 1
# packet-ground-truth validation (docs/phase1-validation.md). It is the smallest set of commands the
# checks need; no stock group fits, because @mobsearch alone is group 99 (admin) upstream:
#   where            own position truth vs the packet-derived position
#   who, whomap      players online / on the map (entity-count cross-check)
#   mapmove          @warp to the test maps (indoor = the save map, outdoor = a field)
#   mobsearch        monster positions on the map (entity cells cross-check)
#   monster          spawn a known number of monsters for the count check
#   killmonster2     remove them again afterwards (no drops)
#   hide             invisible: monsters ignore the GM while it validates
#   alive, heal      lab only (Batt, 2026-10-04): the level-1 GM was killed twice by Porings during
#                    dataset collection; it revives / refills itself instead of lying dead
#   item             lab only (Batt, 2026-10-07): ground items for the walk@6 PICKUP-cursor
#                    calibration -- @item into the GM's inventory, then dropped on the floor
#                    (the GM died hunting Porings for drops; killmonster2 drops nothing)
#   baselevelup /    lab only (Batt, 2026-10-09 ~16:00): the GM's FIXED TEST STATE -- a loot kill
#   joblevelup       levelled the GM (Base Lv 2); lowering takes back that level's status points
#                    (pinned atcommand.cpp ACMD_FUNC(baselevelup)); scripts/gm_state.py restores
#                    Lv 1 / Job 1 at each run start and records the state.
#   monsterignore    lab only (Batt, 2026-10-09): the visual-diversity block's test condition --
#                    monsters ignore the GM (atcommand.cpp:9025 toggles PCBLOCK_IMMUNE; battle.cpp
#                    :8010 makes an immune player no enemy target) while they keep moving, and the
#                    GM's own clicks still send their requests (the safety signal stays valid).
#                    Nothing visible changes (no @hide, no equipment): the pixels stay the same.
#   resetstat /      lab only (Batt, 2026-10-13, decision 5: "@streset / @skreset for GM group 20
#   resetskill       (lab)"): typed as their stock aliases @streset / @skreset. The pinned
#                    atcommand.cpp ACMD_FUNC(resetstat) = pc_resetstate, ACMD_FUNC(resetskill) =
#                    pc_resetskill(sd, 1). allocate_stat@1's restore (a stat point is otherwise
#                    irreversible) and learn_skill@1's server-side restore.
#   jobchange      lab only (Batt, 2026-10-21, on the day report: "Yes, add jobchange to group 20
#                  (logged)"): the dedicated CRUSADER test character (a 2nd character on this account,
#                  docs/planning/crusader-orcsdun01.md) goes Novice -> Swordman -> Crusader. Typed as
#                  @job; pinned atcommand.cpp:1203 ACMD_FUNC(jobchange) -> pc_jobchange. Group 20 is per
#                  ACCOUNT, so the Novice GM could be changed too: every such command checks the
#                  character's name + job on Basic Info first and refuses on a mismatch.
#   questskill     lab only (Batt, 2026-10-21: "GRANT them by GM command too ... add only that
#                  permission to group 20, logged"): the Crusader's quest skills 144 Moving HP
#                  Recovery, 145 Fatal Blow (Attack Weak Point), 146 Auto Berserk, 1002 Shrink.
#                  Pinned atcommand.cpp:3819 ACMD_FUNC(questskill) -> pc_skill(..., ADDSKILL_PERMANENT).
# LogCommands: every command lands in atcommandlog (offline audit). Inherits Player for the basics.
# No permissions beyond Player's otherwise: no zeny/stat commands, no any_warp, no hide_session.
Header:
  Type: PLAYER_GROUP_DB
  Version: 1

Body:
  - Id: 20
    Name: Validation
    Level: 1
    Inherit:
      Player: true
    LogCommands: true
    Commands:
      where: true
      who: true
      whomap: true
      mapmove: true
      mobsearch: true
      monster: true
      killmonster2: true
      hide: true
      alive: true
      heal: true
      item: true
      monsterignore: true
      baselevelup: true
      joblevelup: true
      resetstat: true
      resetskill: true
      jobchange: true
      questskill: true
