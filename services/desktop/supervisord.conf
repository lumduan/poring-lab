; supervisord priorities only order the starts; each script waits for the X server itself.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=/usr/local/bin/start-xvfb.sh
user=desk
environment=HOME="/home/desk",USER="desk"
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; The ONE RDP session. Credentials come from the container environment and are fed to xfreerdp3
; through stdin (/args-from:stdin) -- never put %(ENV_RDP_PASSWORD)s in a command= line, it would
; land in argv and therefore in `ps`.
[program:rdp]
command=/usr/local/bin/rdp-loop.sh
user=desk
environment=HOME="/home/desk",USER="desk"
priority=20
autorestart=true
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
command=/usr/local/bin/run-x11vnc.sh
user=desk
environment=HOME="/home/desk",USER="desk"
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /opt/novnc 6080 127.0.0.1:5900
user=desk
environment=HOME="/home/desk",USER="desk"
priority=40
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
