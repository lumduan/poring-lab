# click made while the GM moves can land up to ~3 cells further along its walk than the cell aimed
# at (frames lag the server ~0.5 s), so a destination just outside the area still stops >= 1 cell
# short of the span (one door's area reaches 2 cells further west: its note says why). Each warp's
# ARRIVAL from the neighbouring map (or from its house) lies inside its area.
#
# SCRIPT NPCs. The 5 NPCs the pre-renewal server loads on this map (data/kb/npc_cells.json) are
# dialog NPCs with NO touch area, all drawn. A click on one opens a dialog (an NPC contact, a hard
# bar). Each NPC cell is grown by 4 cells on every side like a span of 0: the drawn body covers its
# cell and up to 3 cells north of it on the RDP camera (the Kafra's idle box, 80.5 px up), so the
# area keeps walk targets, strikes and loot off the sprite with a cell to spare.
#
# The offline proof (check, prove, zone clicks): docs/planning/gef10-prep.md section 4.
