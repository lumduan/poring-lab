# The environment interlock's ALLOWLIST (ADR-0016, rewritten 2026-10-04; ADR-0006).
#
# A LOGIC interlock (Batt, 2026-10-04): the lab stays flexible -- adding a server or a client is an
# entry HERE plus an ADR-0006 entry, never code. The interlock adds no OS-level lock. Since
# 2026-10-05 (Batt), the lab client EXEs get an exe-scoped outbound allowlist (lab host + loopback
# only; never OS-wide, never the community client; APPLIED 2026-10-06, group `poring-lab lab-only`)
# and a durable watcher task: ADR-0016, ADR-0013.
#
# The backend reads this file (mounted read-only at /lab-config) and gates the mux: BOT presses
# pass only while an `allowed` environment's signals are ALL green; in ASSIST, a bounded operator
# window (scripts/capture_backend.py window, <= 120 s) also lets them through. Missing, unreadable
# or invalid file => every bot press is refused (fail closed). Human input is never gated.
#
# Signals (what each name means is fixed in poring_backend/interlock.py):
#   lab_host  the capture-backend lock is steady on rdp|console, and the backend's WIN_HOST and
#             the sniffer's client_ip are this environment's windows_host;
#   session   the sniffer's attestation: fresh (<= attestation_max_age_s), a live map session to
#             THIS server (the attested `server` == this entry's id: one sniffer per rathena, each
#             naming its server, 2026-10-05), from windows_host, for one of `accounts`
#             (rAthena login.account_id).
# No secrets here: account ids are numbers the server assigns; login ids stay in .env.
version: 1
attestation_max_age_s: 10
window_max_s: 120
environments:
  - id: lab-rathena
    title: "Lab rAthena (this lab's server)"
    summary: "The lab's own rAthena server on this network; the bot may act here once its servers are confirmed."
    status: allowed            # allowed | pending | forbidden
    adr: "ADR-0006 environment 1 (the self-hosted rAthena)"
    # the lab host: bot-server since the 2026-11-07 cutover (192.168.1.13 = VM 103 before it)
    server: {host: 192.168.1.228, ports: [6900, 6121, 5121]}
    windows_host: 192.168.1.169
    client:                    # the lab profile ro_agent launches and verifies (login phase)
      exe: 'C:\RO-rAthena\client\PoringLab.exe'
      shortcut: "Ragnarok Offline"
      server_select: "PoringLab LAN (rAthena)"
    accounts: [2000001, 2000002]   # the agent (group 0) and the validation GM (group 20)
    signals: [lab_host, session]
  - id: lab-rathena-th
    title: "Lab rAthena, Thai data (stopped)"
    summary: "A second lab server with the Thai client data; normally stopped."
    # The Thai-data experiment (Batt, 2026-10-05): the same rAthena code with a map cache made
    # from the Thai client's GRF, its own database (db-th), and a separate client copy. Runs ONE AT
    # A TIME with lab-rathena (same address and ports); sniffer-th attests server=lab-rathena-th.
    # Batt, 2026-10-05: NOT adopted; kept as a documented, STOPPED option (db-th stopped, volume
    # kept). Allowed stays true: it is still our own lab server if ever started again.
    status: allowed
    adr: "ADR-0006 environment 1b (the self-hosted rAthena, Thai-data experiment)"
    # the lab host: bot-server since the 2026-11-07 cutover (192.168.1.13 = VM 103 before it)
    server: {host: 192.168.1.228, ports: [6900, 6121, 5121]}
    windows_host: 192.168.1.169
    client:
      exe: 'C:\RO-rAthena-th\client\PoringLab.exe'
      shortcut: "Ragnarok Offline TH"
      server_select: "PoringLab LAN (rathena-th)"   # the service-select line, read 2026-10-05
    accounts: [2000000, 2000001]   # db-th's agent (group 0) and GM (group 20), read back 2026-10-05 13:51.
    # NOTE: 2000001 is ALSO lab-rathena's agent: only the attested `server` tells them apart.
    signals: [lab_host, session]
  - id: official-ro-thai
    title: "Official Thai RO"
    summary: "The official Thai Ragnarok servers; the bot never acts here."
    # KNOWN-FORBIDDEN (Batt, 2026-10-05): the official Thai RO servers the Thai client data points
    # at (its GRF's own data\clientinfo.xml). Never green: forbidden, no signals. Our th client
    # overrides that file with a loose one pointing at rathena-th; defence in depth on the Dell is
    # scoped to the lab client EXEs only, never OS-wide (a future user may play official Thai RO
    # normally on that PC): (1) since 2026-10-06 the exe-scoped allowlist group `poring-lab
    # lab-only` (it replaced the 2026-10-05 th-exe block rule; 2 rules since 2026-10-06, when the
    # th client copy was removed from the Dell -- ADR-0019; rathena-th has NO client copy now);
    # (2) the LAB-ONLY `poring-lab watch` task (any non-lab address kills the exe; retirement
    # criteria in ADR-0019); (3) the sniffer's attestation (server=lab-rathena-th).
    status: forbidden
    adr: "ADR-0006 (official servers: forbidden); ADR-0016 known-forbidden endpoints"
    # Port 3000 too: the Thai data's own AssistAddr (lua files\service_thailand\externalsettings_th.lub
    # = thro-acc3.gnjoy.in.th:3000; its _stage twin = 49.229.28.99:3000), read at character select.
    server: {host: thro-acc3.gnjoy.in.th, ports: [50001, 3000]}   # 49.229.28.13 on 2026-10-05; *.gnjoy.in.th
    signals: []
    # Machine-readable since 2026-10-06 (the Settings page refuses them as allowed servers): the
    # whole official domain, the registration web, the stage assist, and the login's address.
    forbidden_endpoints: [.gnjoy.in.th, roc.gnjoy.in.th, "49.229.28.99:3000", 49.229.28.13]
    note: "Record only: never connect, never test against."
  - id: official-ro-korea
    title: "Official Korean RO (kRO)"
    summary: "Gravity's official Korean Ragnarok services; the bot never acts here."
    # KNOWN-FORBIDDEN (found 2026-10-05 14:58 by the th client's watcher, which killed the client):
    # the 2021 exe at CHARACTER SELECT opens AssistAddr from the kRO data's
    # lua files\service_korea\externalsettings_kr*.lub (in data.grf / rdata.grf, servicetype korea):
    # kro-assit.ragnarok.co.kr:3000 (Cloudflare: 104.18.20.108, 104.18.21.108 on 2026-10-05).
    # The th client overrides it with loose files (AssistAddr = 127.0.0.1:3000, client config only;
    # docs/thai-data-experiment.md section 4). The MAIN lab client got the same override 2026-10-05 16:23.
    # Since 2026-11-05 the main client's AssistAddr is the lab's own rAthena web-server,
    # 192.168.1.13:8888 (Batt: fix the account-settings error); this endpoint stays forbidden.
    # ➡️ Since the 2026-11-07 cutover: 192.168.1.228:8888 (bot-server; the four lubs rewritten).
    status: forbidden
    adr: "ADR-0006 (official servers: forbidden); ADR-0016 known-forbidden endpoints"
    server: {host: kro-assit.ragnarok.co.kr, ports: [3000]}
    signals: []
    # Machine-readable since 2026-10-06: the whole official domain and the _sak / _qm assist hosts.
    # Its Cloudflare addresses are NOT listed: shared CDN IPs would forbid unrelated servers.
    forbidden_endpoints: [.ragnarok.co.kr, "kro-assit-s.ragnarok.co.kr:3000", "kro-qm-1a.ragnarok.co.kr:3000"]
    note: "Record only: never connect, never test against."
  - id: community-bot-testing
    title: "Community bot-testing server"
    summary: "Not approved yet: the server owner's written permission is still pending, and the lab cannot verify a session there (packet capture is not allowed on that server); you may still play there yourself."
    status: pending            # forbidden until its permission evidence AND its own signal set exist
    adr: "ADR-0006 environment 2; issue #2; docs/environments/community-server.md"
    signals: []                # none designed: packet capture is not allowed there
    note: "Batt may play there manually, as the human. No automation."
