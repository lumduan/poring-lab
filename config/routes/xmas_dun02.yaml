# 11-cell step west at y 156), west along the south edge, and the 2 + 4-cell step round the wall
# end at (9-10, 22) back to the start: (7,21) -> (7,253) -> (251,253) -> (251,156) -> (240,156) ->
# (240,23) -> (11,23) -> (11,21) -> (7,21). Every cell of those segments is walkable on the
# runner's stand grid. The agent placed a waypoint on each corner and every <= 12 cells between
# (each side split into ceil(length / 12) equal legs), so each leg is a straight run along the
# edge: on the route grid its A* path is the straight segment itself (0 cells off it), never a
# cut through the interior maze. The offline proof (check, prove, the per-leg path check):
# docs/planning/xmas02-prep.md section 3.
